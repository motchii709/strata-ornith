name: Build CUDA engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA Toolkit 13.2
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure for sm_75 (GTX 1650)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75
      - name: Build strata.exe
        run: cmake --build build --target strata -j4
      - name: Show binary
        run: Get-Item build\strata.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-cuda13-sm75
          path: build/strata.exe
          if-no-files-found: error
